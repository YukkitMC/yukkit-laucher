name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: npm install

      - name: Build launcher
        run: npx tauri build --bundles nsis

      - name: Collect files
        shell: bash
        run: |
          mkdir dist-release
          cp src-tauri/target/release/bundle/nsis/*.exe dist-release/
          cp src-tauri/target/release/yukkit-launcher.exe "dist-release/YukkitLauncher-portable.exe"
          ls -la dist-release

      - uses: actions/upload-artifact@v4
        with:
          name: yukkit-launcher-windows
          path: dist-release/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-release/* --clobber
          else
            gh release create "$TAG" dist-release/* --title "Yukkit Launcher $TAG" --notes-file .github/release-notes.md
          fi
