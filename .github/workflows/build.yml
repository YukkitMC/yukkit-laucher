name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: npm install

      - name: Build launcher
        run: npx tauri build --bundles nsis

      - name: Collect files
        shell: bash
        run: |
          mkdir dist-release
          cp src-tauri/target/release/bundle/nsis/*.exe dist-release/
          cp src-tauri/target/release/yukkit-launcher.exe "dist-release/YukkitLauncher-portable.exe"
          ls -la dist-release

      - uses: actions/upload-artifact@v4
        with:
          name: yukkit-launcher-windows
          path: dist-release/*

      # A push to main releases the version in tauri.conf.json if it has no release yet,
      # so bumping the version is all it takes to ship. A pushed v* tag also releases.
      - name: Publish release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              gh release upload "$TAG" dist-release/* --clobber
            else
              echo "Release $TAG already exists — bump the version in tauri.conf.json to publish a new one."
            fi
          else
            gh release create "$TAG" dist-release/* --target "$GITHUB_SHA" --title "Yukkit Launcher $TAG" --notes-file .github/release-notes.md
          fi
