[package]
name = "yukkit-launcher"
version = "0.1.0"
description = "A desktop launcher that installs, updates and starts LiquidBounce"
authors = ["YukkitMC"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "http2", "charset"] }

dirs = "5"
sha1 = "0.10"
md5 = "0.7"
uuid = { version = "1", features = ["v4"] }

zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
